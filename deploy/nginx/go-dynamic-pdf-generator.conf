# nginx server block for go-dynamic-pdf-generator, running ALONGSIDE the
# existing Node PDF service on the same EC2 host.
#
# Install:
#   sudo cp deploy/nginx/go-dynamic-pdf-generator.conf \
#     /etc/nginx/sites-available/go-dynamic-pdf-generator
#   sudo ln -s /etc/nginx/sites-available/go-dynamic-pdf-generator \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <PDF_SUBDOMAIN>      # adds the 443 block + redirect
#
# Replace <PDF_SUBDOMAIN> below (e.g. api-go-pdf.synectus.com). The Go service
# listens on 127.0.0.1:8080 — never bind it to a public interface; this proxy
# plus its API key are the only front door.

upstream go_pdf_service {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name <PDF_SUBDOMAIN>;

    # certbot rewrites this to a 301 -> https after you run it.
    # Until then, plain HTTP works so you can smoke-test.

    # A rendered report can be a few MB of HTML; default 1m is too small.
    client_max_body_size 12m;

    # Health probes are unauthenticated by design; expose them for uptime
    # checks but keep them cheap.
    location = /livez  { proxy_pass http://go_pdf_service; access_log off; }
    location = /readyz { proxy_pass http://go_pdf_service; access_log off; }
    location = /healthz { proxy_pass http://go_pdf_service; access_log off; }

    location / {
        proxy_pass http://go_pdf_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A request may sit in the service's admission queue under a burst
        # before its render slot frees, then render for tens of seconds. This
        # must be >= the calling backend's own client timeout (pdfServiceClient
        # uses 120s) so nginx isn't the one that cuts a legitimately-queued
        # request off.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # The service streams raw PDF bytes back; don't let nginx buffer the
        # whole thing to disk first.
        proxy_buffering off;
    }
}
